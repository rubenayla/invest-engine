name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'notes/**'
      - '.agents/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check src tests || echo "::warning::Lint issues found (non-blocking)"
          uv run ruff format --check src tests || echo "::warning::Format issues found (non-blocking)"

      - name: Test (fast)
        run: uv run pytest -m "not slow" --no-cov -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this push changes deployable files
        id: deploy-scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$BEFORE_SHA" == "$zero_sha" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Could not find the push base commit $BEFORE_SHA; refusing to deploy." >&2
            exit 1
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- src/ scripts/ dashboard/ models/ infra/ pyproject.toml uv.lock; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No deployable files changed; dashboard deployment skipped."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cloudflared
        if: steps.deploy-scope.outputs.should_deploy == 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output "$HOME/bin/cloudflared"
          chmod 755 "$HOME/bin/cloudflared"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure SSH
        if: steps.deploy-scope.outputs.should_deploy == 'true'
        env:
          Y540_SSH_KEY: ${{ secrets.Y540_SSH_KEY }}
          Y540_SSH_KNOWN_HOSTS: ${{ secrets.Y540_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$Y540_SSH_KEY"
          test -n "$Y540_SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$Y540_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$Y540_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy to y540
        if: steps.deploy-scope.outputs.should_deploy == 'true'
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            rubenayla@ssh.rubenayla.xyz \
            "EXPECTED_DEPLOY_SHA=$GITHUB_SHA bash -s" < scripts/deploy_y540.sh
